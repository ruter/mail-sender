name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6>=6.5 pyinstaller>=6.0 openpyxl
      
      - name: Build executable
        run: python build.py
        env:
          PYTHONIOENCODING: utf-8
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mail-assistant-windows
          path: dist/邮件助手/
          retention-days: 30
      
      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path "dist/邮件助手\*" -DestinationPath "mail-assistant-windows.zip"
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: mail-assistant-windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
