name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller>=6.0
      
      - name: Build executable
        run: |
          pyinstaller --name="MailAssistant" --onedir --windowed --noconfirm --clean --add-data="mail_assistant/db/migrations.sql;db" mail_assistant/app.py
      
      - name: Create ZIP archive
        run: |
          Compress-Archive -Path "dist/MailAssistant/*" -DestinationPath "MailAssistant-windows-${{ github.ref_name }}.zip"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: MailAssistant-windows-${{ github.ref_name }}.zip

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: MailAssistant-windows-*.zip
          generate_release_notes: true
